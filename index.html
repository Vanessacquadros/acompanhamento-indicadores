<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financeiro Completo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div class="max-w-6xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <p class="text-[10px] uppercase font-bold text-slate-400">Resultado do Período</p>
                <p id="kpi-resultado" class="text-xl font-bold text-indigo-700">R$ 0,00</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <p class="text-[10px] uppercase font-bold text-slate-400">Payback Acumulado</p>
                <p id="kpi-payback" class="text-xl font-bold text-slate-800">0 meses</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <p class="text-[10px] uppercase font-bold text-slate-400">ROI Histórico</p>
                <p id="kpi-roi" class="text-xl font-bold text-slate-800">0%</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
                <p class="text-[10px] uppercase font-bold text-slate-400">TIR Estimada</p>
                <p id="kpi-tir" class="text-xl font-bold text-emerald-600">0%</p>
            </div>
        </div>

        <section class="bg-white p-6 rounded-2xl border shadow-sm">
            <select id="filtro-ano" onchange="renderApp()" class="mb-4 bg-slate-50 border p-2 rounded-lg text-sm">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
            </select>
            <div class="h-64">
                <canvas id="mainChart"></canvas>
            </div>
        </section>
    </div>

    <script>
        // Dados iniciais e estado
        let lancamentos = JSON.parse(localStorage.getItem('simulador_lancamentos')) || [];
        let chartInstance = null;

        const formatCurrency = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function renderApp() {
            const filtroAno = document.getElementById('filtro-ano').value;
            
            // Variáveis de Cálculo Histórico (para Payback, ROI e TIR)
            let totalInvestido = 0;
            let totalLucro = 0;
            
            // Variáveis de Cálculo do Período (para Resultado)
            let resultadoPeriodo = 0;

            lancamentos.forEach(item => {
                const itemDate = new Date(item.data);
                
                // Histórico Total
                if(item.tipo === 'investimento') totalInvestido += item.valor;
                if(item.tipo === 'receita') totalLucro += item.valor;
                if(item.tipo === 'despesa') totalLucro -= item.valor;

                // Período Filtrado
                if(itemDate.getFullYear() == filtroAno) {
                    resultadoPeriodo += (item.tipo === 'receita' ? item.valor : (item.tipo === 'despesa' ? -item.valor : 0));
                }
            });

            // Lógica financeira: Payback e ROI baseados no histórico
            const mesesDeVida = 6; // Exemplo: estimativa de meses de operação
            const lucroMensal = totalLucro / mesesDeVida;

            document.getElementById('kpi-resultado').innerText = formatCurrency(resultadoPeriodo);
            document.getElementById('kpi-payback').innerText = totalInvestido > 0 ? (totalInvestido / Math.max(1, lucroMensal)).toFixed(1) + ' meses' : '-';
            document.getElementById('kpi-roi').innerText = totalInvestido > 0 ? ((totalLucro / totalInvestido) * 100).toFixed(1) + '%' : '-';
            document.getElementById('kpi-tir').innerText = totalInvestido > 0 ? ((lucroMensal / totalInvestido) * 100).toFixed(1) + '%' : '-';
        }

        renderApp();
    </script>
</body>
</html>
